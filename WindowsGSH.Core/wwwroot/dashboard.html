<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – WindowsGSH</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <nav class="nav" id="nav"></nav>

  <main class="page">

      <h2 class="page-title">Servers</h2>
