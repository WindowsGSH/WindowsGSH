<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in – WindowsGSH</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1 class="login-title">Windows<span>GSH</span></h1>
      <p class="login-subtitle">Game Server Host</p>

      <form id="loginForm" autocomplete="on" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input class="form-input" id="username" type="text" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" id="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary form-submit" id="submitBtn" type="submit">Sign in</button>
        <div class="alert alert-error hidden" id="errorMsg"></div>
      </form>

      <!-- Shown only when the server forces a password change on first login -->
      <div id="changePasswordPanel" class="hidden">
        <p class="alert alert-info alert-spaced">
          You must set a new password before continuing.
        </p>
        <form id="changePasswordForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="currentPasswordForChange">Current password</label>
            <input class="form-input" id="currentPasswordForChange" type="password" autocomplete="current-password">
          </div>
          <div class="form-group">
            <label class="form-label" for="newPassword">New password</label>
            <input class="form-input" id="newPassword" type="password" autocomplete="new-password" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm password</label>
            <input class="form-input" id="confirmPassword" type="password" autocomplete="new-password" required>
          </div>
          <button class="btn btn-primary form-submit" id="cpSubmitBtn" type="submit">Set password</button>
          <div class="alert alert-error hidden" id="cpErrorMsg"></div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
